name: mother_app
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  flutter_svg: ^2.3.0
  intl: ^0.20.3
  custom_masonry_grid: ^1.0.4
  flutter_riverpod: ^3.3.2
  flutter_markdown_plus: ^1.0.12
  window_manager: ^0.5.2
  flutter_scene: ^0.24.3
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  file_picker: ^13.3.0
  path_provider: ^2.1.6
  llamadart: ^0.17.2
  flutter_litert: ^3.9.4
  syncfusion_flutter_datepicker: ^35.1.43

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icons/mother_app.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/mother_app.png"
  adaptive_icon_foreground_inset: 16

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/mother_app.png

  android: true
  ios: true

  android_12:
    color: "#FFFFFF"
    image: assets/icons/mother_app.png
    icon_background_color: "#FFFFFF"
